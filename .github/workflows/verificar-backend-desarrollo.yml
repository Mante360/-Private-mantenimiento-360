name: Verificar backend de desarrollo

on:
  push:
    branches:
      - desarrollo-base-datos-seguridad-20261011
    paths:
      - ".github/workflows/verificar-backend-desarrollo.yml"
      - "database/**"
      - "test/**"
      - "test-ui/**"
      - "src/**"
      - "package.json"
      - "tsconfig.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compilar-y-probar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test360
          POSTGRES_PASSWORD: only-fixture-password-360
          POSTGRES_DB: mantenimiento360_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test360 -d mantenimiento360_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://test360:only-fixture-password-360@localhost:5432/mantenimiento360_test
      JWT_SECRET: github-actions-test-secret-only-0123456789abcdefghijklmnop
      FRONTEND_ORIGIN: http://localhost:45678
      PORT: "45678"
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Compilar TypeScript en modo estricto
        run: npm run build
      - name: Verificar archivos compilados
        run: test -f dist/server.js && test -f dist/security.js && test -f dist/routes/jobs.js
      - name: Verificar renovacion de sesiones y limite de seguridad
        run: node test/session-renewal.smoke.mjs
      - name: Probar instalacion controlada en otra base temporal
        run: node test/bootstrap-schema.integration.mjs
      - name: Validar restablecimiento de contraseña administrado y protegido
        run: node test/lab-password-reset.integration.mjs
      - name: Validar esquema PostgreSQL aislado
        run: node test/schema.smoke.mjs
      - name: Probar aislamiento entre cliente, profesional y administracion
        env:
          DATABASE_URL: postgresql://test360:only-fixture-password-360@localhost:5432/mantenimiento_360_db_pruebas_20261012
        run: node test/backend-api.integration.mjs
      - name: Probar presupuestos y contratacion unica
        env:
          DATABASE_URL: postgresql://test360:only-fixture-password-360@localhost:5432/mantenimiento_360_db_pruebas_20261012
        run: node test/quotes.integration.mjs
      - name: Validar solicitudes y aprobacion exclusiva de nuevos oficios
        env:
          DATABASE_URL: postgresql://test360:only-fixture-password-360@localhost:5432/mantenimiento_360_db_pruebas_20261012
        run: node test/profession-requests.integration.mjs
      - name: Probar circuito documental, correcciones y permisos de subadministradores
        env:
          DATABASE_URL: postgresql://test360:only-fixture-password-360@localhost:5432/mantenimiento_360_db_pruebas_20261012
        run: node test/document-corrections.integration.mjs
      - name: Probar reclamos, garantias, conformidad y desbloqueo del profesional
        env:
          DATABASE_URL: postgresql://test360:only-fixture-password-360@localhost:5432/mantenimiento_360_db_pruebas_20261012
        run: node test/claims-warranties.integration.mjs
      - name: Probar pagos ficticios sin dinero, importe real de la oferta y contratacion unica
        env:
          CI: "true"
          DATABASE_URL: postgresql://test360:only-fixture-password-360@localhost:5432/mantenimiento_360_db_pruebas_20261012
        run: node test/payment-simulation.integration.mjs
      - name: Probar mensajes privados persistentes despues de contratar
        env:
          CI: "true"
          DATABASE_URL: postgresql://test360:only-fixture-password-360@localhost:5432/mantenimiento_360_db_pruebas_20261012
        run: node test/messages.integration.mjs
      - name: Probar direcciones exactas privadas y domicilio solo para profesional elegido
        env:
          CI: "true"
          DATABASE_URL: postgresql://test360:only-fixture-password-360@localhost:5432/mantenimiento_360_db_pruebas_20261012
        run: node test/private-address.integration.mjs

  interfaz-en-navegador:
    name: Probar las pantallas reales con Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test360
          POSTGRES_PASSWORD: only-fixture-password-360
          POSTGRES_DB: mantenimiento360_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test360 -d mantenimiento360_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: "true"
      DATABASE_URL: postgresql://test360:only-fixture-password-360@localhost:5432/mantenimiento360_test
      JWT_SECRET: github-actions-test-secret-only-0123456789abcdefghijklmnop
      FRONTEND_ORIGIN: http://localhost:45678
      PORT: "45678"
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependencias y navegador temporal
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Compilar API
        run: npm run build
      - name: Preparar base de datos aislada con cuentas ficticias
        run: node test/bootstrap-schema.integration.mjs
      - name: Probar registro, oficios, documentacion y roles con clicks reales
        env:
          DATABASE_URL: postgresql://test360:only-fixture-password-360@localhost:5432/mantenimiento_360_db_pruebas_20261012
        run: node test/browser-ui.integration.mjs
      - name: Probar pantallas de reclamos y garantias en tres cuentas distintas
        env:
          DATABASE_URL: postgresql://test360:only-fixture-password-360@localhost:5432/mantenimiento_360_db_pruebas_20261012
        run: node test/claims-browser.integration.mjs
      - name: Probar pantallas de pagos simulados sin conexión externa
        env:
          DATABASE_URL: postgresql://test360:only-fixture-password-360@localhost:5432/mantenimiento_360_db_pruebas_20261012
        run: node test/payment-browser.integration.mjs
      - name: Probar conversaciones privadas con clicks reales y persistencia de historial
        env:
          DATABASE_URL: postgresql://test360:only-fixture-password-360@localhost:5432/mantenimiento_360_db_pruebas_20261012
        run: node test/messages-browser.integration.mjs
      - name: Guardar capturas para diagnostico si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-pantallas-laboratorio
          path: test-results/*.png
          if-no-files-found: ignore
